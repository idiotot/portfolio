# Generated by prepare_github_pages.py 3.1; narrowed to the tools this site uses.
name: Deploy Hugo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.167.0'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/hugo"
          curl -fL --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/hugo"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
          echo "HUGO_CACHEDIR=$RUNNER_TEMP/hugo-cache" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v6
        id: pages
      - name: Build and fix project URL paths
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python .github/pages_build.py --build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
