<figure class="project-screenshot">
  <img src="{{ .Get "src" | relURL }}"
       alt="{{ .Get "alt" }}"
       width="1360" height="860" loading="lazy" decoding="async">
  <figcaption>
    <span>{{ .Get "caption" }}</span>
    <a href="{{ .Get "src" | relURL }}" aria-label="{{ .Get "alt" }} 원본 이미지 보기">원본 이미지 보기</a>
  </figcaption>
</figure>
